<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #020408;
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      margin: 0;
      overflow-x: hidden;
    }

    .gradient-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(80,140,200,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(120,100,200,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(60,160,130,0.04) 0%, transparent 50%);
    }

    .matrix-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
      opacity: 0.15;
    }

    .ide-window {
      width: 100%;
      max-width: 980px;
      background: rgba(12, 15, 20, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 20px;
      box-shadow: 
        0 30px 70px -15px rgba(0,0,0,0.8), 
        0 0 0 1px rgba(100,160,200,0.12),
        inset 0 0 0 1px rgba(255,255,255,0.02);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .ide-window::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(145deg, rgba(20,30,50,0.3) 0%, rgba(5,8,12,0.6) 100%);
      border-radius: 20px;
      pointer-events: none;
    }

    .title-bar {
      background: rgba(30, 35, 41, 0.92);
      padding: 0.6rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 1px solid rgba(42, 48, 56, 0.6);
      position: relative;
      z-index: 2;
    }

    .dots { display: flex; gap: 0.5rem; margin-right: 1rem; }
    .dot { width: 13px; height: 13px; border-radius: 50%; cursor: pointer; transition: filter 0.2s; }
    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #febc2e; }
    .dot.green { background: #28c840; }
    .dot:hover { filter: brightness(1.3); }

    .title-text {
      color: #8899aa;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(21, 26, 33, 0.8);
      padding: 0.3rem 0.9rem;
      border-radius: 8px;
      margin-left: auto;
    }

    .photo-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      background: linear-gradient(135deg, rgba(20,28,40,0.9) 0%, rgba(15,20,30,0.9) 100%);
      border-bottom: 1px solid rgba(100,160,220,0.12);
      position: relative;
      z-index: 2;
    }

    .photo-img {
      width: 70px;
      height: 70px;
      border-radius: 14px;
      object-fit: cover;
      border: 2px solid rgba(120,160,220,0.25);
      box-shadow: 0 0 20px rgba(100,150,220,0.15);
      flex-shrink: 0;
    }

    .photo-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .photo-name {
      color: #dde4ee;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .photo-title {
      color: #8899aa;
      font-size: 0.75rem;
      font-style: italic;
    }

    .editor-body {
      display: flex;
      flex: 1;
      position: relative;
      z-index: 2;
      max-height: 65vh;
    }

    .line-numbers {
      background: rgba(11, 15, 20, 0.75);
      color: #3d4a5c;
      text-align: right;
      padding: 0.8rem 0.5rem;
      user-select: none;
      border-right: 1px solid rgba(33, 38, 45, 0.5);
      font-size: 0.8rem;
      line-height: 1.7;
      min-width: 52px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .code-area {
      flex: 1;
      padding: 0.8rem 0;
      color: #c8d6e5;
      line-height: 1.7;
      overflow-y: auto;
      font-size: 0.85rem;
    }

    .code-area::-webkit-scrollbar { width: 6px; }
    .code-area::-webkit-scrollbar-track { background: transparent; }
    .code-area::-webkit-scrollbar-thumb { background: #2a3340; border-radius: 3px; }

    .cpp-keyword { color: #7aa2d4; }
    .cpp-type { color: #6db3a0; }
    .cpp-string { color: #c8a080; }
    .cpp-comment { color: #5a7a5a; font-style: italic; }
    .cpp-brace { color: #bcc8d8; }
    .cpp-field { color: #8ab8e8; }

    .line {
      display: block;
      padding: 0 1rem;
      white-space: pre;
    }

    .line.indent-1 { padding-left: 3rem; }
    .line.indent-2 { padding-left: 5rem; }
    .line.indent-3 { padding-left: 7rem; }
    .line.indent-4 { padding-left: 9rem; }

    details.code-block { display: block; }

    details.code-block > summary {
      list-style: none;
      cursor: pointer;
      display: block;
      padding: 0 1rem;
      color: #bcc8d8;
      user-select: none;
    }

    details.code-block > summary::-webkit-details-marker { display: none; }

    details.code-block > summary::before {
      content: "\203A";
      display: inline-block;
      font-size: 1.3rem;
      color: #556677;
      transition: transform 0.2s, color 0.2s;
      width: 16px;
      text-align: center;
      margin-right: 0.3rem;
    }

    details.code-block[open] > summary::before {
      transform: rotate(90deg);
      color: #8ab8e8;
    }

    details.code-block > summary:hover { color: #dde4ee; }
    details.code-block > summary:hover::before { color: #aac8e8; }

    details.code-block .block-content {
      border-left: 1px dashed rgba(60, 80, 100, 0.3);
      margin-left: 1.5rem;
    }

    .status-bar {
      background: rgba(22, 27, 34, 0.92);
      border-top: 1px solid rgba(48, 54, 61, 0.6);
      padding: 0.5rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #667788;
      font-size: 0.75rem;
      position: relative;
      z-index: 2;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .status-bar i { margin-right: 0.3rem; }
    .copyright { color: #556677; font-style: italic; }

    a {
      color: #7ab8c8;
      text-decoration: none;
      border-bottom: 1px dotted rgba(122, 184, 200, 0.4);
    }
    a:hover { color: #9ad8e8; }

    @media (max-width: 700px) {
      .line { font-size: 0.7rem; padding: 0 0.5rem; }
      .line.indent-1 { padding-left: 1.5rem; }
      .line.indent-2 { padding-left: 2.5rem; }
      .line.indent-3 { padding-left: 3.5rem; }
      .line.indent-4 { padding-left: 4.5rem; }
      .line-numbers { font-size: 0.65rem; min-width: 38px; }
      .photo-img { width: 50px; height: 50px; }
    }
  </style>
</head>

  (function() {
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789<>/{}[]|&^%$#@!';
    const fs = 15;
    const cols = Math.floor(canvas.width / fs);
    const drops = [];
    for (let i = 0; i < cols; i++) drops[i] = Math.random() * -100;
    function draw() {
      ctx.fillStyle = 'rgba(2, 4, 8, 0.06)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#6699cc';
      ctx.font = fs + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const t = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(t, i * fs, drops[i] * fs);
        if (drops[i] * fs > canvas.height && Math.random() > 0.97) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(draw, 40);
  })();
